# Только антидетект-слой. Сам Firecrawl поднимается из своего официального
# клона (см. README): отдельный репозиторий + docker compose up --build.
services:
  browser-worker:
    build: ./browser-worker
    container_name: browser-worker
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - PROXY_URL=${PROXY_URL:-}
      - HEADED=${HEADED:-false}
      - PROFILE_DIR=/app/profiles/ozon
    volumes:
      - ./browser-worker/profiles:/app/profiles
    restart: unless-stopped

  # Антидетект-слой на Camoufox (анти-детект Firefox, правдоподобный отпечаток).
  # Основной инструмент против Ozon: отдельный Python-воркер, порт 3100.
  camou-worker:
    build: ./camou-worker
    container_name: camou-worker
    # Firefox sandbox в root-контейнере требует userns: ослабляем seccomp
    security_opt:
      - seccomp:unconfined
    ports:
      - "3100:3100"
    environment:
      - PROXY_URL=${PROXY_URL:-}
      - HEADED=${HEADED:-false}
    restart: unless-stopped
